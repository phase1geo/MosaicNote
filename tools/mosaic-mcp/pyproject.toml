[project]
name = "mosaic-mcp"
version = "0.1.0"
description = "Read-only MCP server for MosaicNote's XML notebook database"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
]

[project.scripts]
mosaic-mcp = "mosaic_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mosaic_mcp*"]
